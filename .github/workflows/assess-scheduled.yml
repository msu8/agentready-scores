name: Assess repos (scheduled)

on:
  # schedule:
  #   - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC — uncomment once credentials are set up
  workflow_dispatch:
    inputs:
      org:
        description: 'GitHub org to assess (overrides org YAML files)'
        required: false
      workers:
        description: 'Max concurrent workers'
        default: '5'
        required: false

jobs:
  check-auth:
    runs-on: ubuntu-latest
    # Scheduled runs are always trusted; only check on manual dispatch
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify actor is a member of the allowed org
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ALLOWED_ORG: ${{ vars.ALLOWED_ORG }}
        run: |
          if [ -z "$ALLOWED_ORG" ]; then
            echo "ALLOWED_ORG variable not set — skipping membership check"
            exit 0
          fi
          echo "Checking if ${{ github.actor }} is a member of ${ALLOWED_ORG}..."
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${ALLOWED_ORG}/members/${{ github.actor }}")
          if [ "$status" != "204" ]; then
            echo "::error::${{ github.actor }} is not a member of ${ALLOWED_ORG} (HTTP ${status}). Access denied."
            exit 1
          fi
          echo "${{ github.actor }} is a verified member of ${ALLOWED_ORG}."

  assess:
    runs-on: ubuntu-latest
    needs: [check-auth]
    if: always() && (needs.check-auth.result == 'success' || needs.check-auth.result == 'skipped')
    permissions:
      contents: write
    outputs:
      failed_count: ${{ steps.summary.outputs.failed_count }}
      failed_repos: ${{ steps.summary.outputs.failed_repos }}
      has_failures: ${{ steps.summary.outputs.has_failures }}
      new_repos_count: ${{ steps.summary.outputs.new_repos_count }}
      new_repos: ${{ steps.summary.outputs.new_repos }}
      has_new_repos: ${{ steps.summary.outputs.has_new_repos }}

    steps:
      - name: Checkout central repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: runner/requirements.txt

      - name: Install dependencies
        run: pip install -r runner/requirements.txt

      - name: Configure git for pushing
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config credential.helper store
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials

      - name: Validate GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 runner/collect_summary.py --validate-token

      - name: Run assessments
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "${{ inputs.org }}" ]; then
            python3 runner/assess.py \
              --org "${{ inputs.org }}" \
              --workers "${{ inputs.workers || '5' }}" \
              --retries 1
          else
            python3 runner/assess.py \
              --from-file runner/orgs/*.yaml \
              --workers "${{ inputs.workers || '5' }}" \
              --retries 1
          fi

      - name: Collect result summary
        if: always()
        id: summary
        run: python3 runner/collect_summary.py

      - name: Commit failed/inaccessible/new repos YAML (if any)
        if: always()
        run: |
          git add -A -- 'runner/status/*.yaml'
          if ! git diff --cached --quiet; then
            git commit -m "chore: record failed/inaccessible/new repos from run ${{ github.run_id }}" || true
            git push || true
          fi

      - name: Upload failed/inaccessible repos artifact (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-repos
          path: |
            runner/status/failed-*.yaml
            runner/status/inaccessible-*.yaml
          if-no-files-found: ignore

  notify:
    runs-on: ubuntu-latest
    needs: assess
    if: failure() && vars.SLACK_NOTIFICATIONS == 'true'
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *AgentReady assessment failed* — ${{ needs.assess.outputs.failed_count }} repo(s) failed",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Workflow", "value": "${{ github.workflow }}", "short": true },
                  { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                  { "title": "Failed repos", "value": "${{ needs.assess.outputs.failed_repos || 'unknown' }}", "short": false },
                  { "title": "Run summary", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false },
                  { "title": "Failed repos artifact", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts", "short": false }
                ]
              }]
            }

  notify-new-repos:
    runs-on: ubuntu-latest
    needs: assess
    if: success() && needs.assess.outputs.has_new_repos == 'true' && vars.SLACK_NOTIFICATIONS == 'true'
    steps:
      - name: Notify Slack of newly-scored repos
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":tada: *New repo(s) scored* — ${{ needs.assess.outputs.new_repos_count }} repo(s)",
              "attachments": [{
                "color": "good",
                "fields": [
                  { "title": "New repos", "value": "${{ needs.assess.outputs.new_repos }}", "short": false },
                  { "title": "Run summary", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
